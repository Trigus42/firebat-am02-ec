apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firebat-ec.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firebat-ec.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "firebat-ec.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firebat-ec.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.daemon.config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostPID: false
      hostNetwork: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: firebat-ec
          image: {{ include "firebat-ec.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - daemon
            - -config
            - /etc/firebat-ec/config.json
          securityContext:
            # Privileged is required because the container needs access to
            # /dev/port, and the device cgroup in Kubernetes blocks access to
            # character devices in non-privileged containers regardless of
            # capabilities. CAP_SYS_RAWIO alone is insufficient.
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/firebat-ec
              readOnly: true
            - name: dev-port
              mountPath: /dev/port
              readOnly: false
      volumes:
        - name: config
          configMap:
            name: {{ include "firebat-ec.fullname" . }}
        - name: dev-port
          hostPath:
            path: /dev/port
            type: CharDevice
